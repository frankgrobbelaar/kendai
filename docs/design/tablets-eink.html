------------------------------------------
 From the docks, head north past the
 lantern posts. The archive door opens
 only once all three are lit:

        [*]-----[*]-----[*]
         |       |       |
        WEST   CENTRE   EAST

 Light WEST first, then EAST, and CENTRE
 last. Inside, take the Tide Key from the
 chest left of the stairs before the
 water rises (about 90 seconds).

 THE FLOODED STACKS
 ------------------
 The Tide Key opens the grate on the
 lower floor. Swim through the second
 gap in the shelves, not the first; the
 first is a dead end with an eel.

 Boss: THE ARCHIVIST (see [BOS01])
 Bring two lanterns. She is weak to
 light, and the room is dark.</pre>

<p style="margin: 0">and especially whenever my hypos get such an upper hand of me, that it requires a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people's hats off—then, I account it high time to get to sea as soon as I can. This is my substitute for pistol and ball. With a philosophical flourish Cato throws himself upon his sword; I quietly take to the ship. There is nothing surprising in this. If they but knew it, almost all men in their degree, some time or other, cherish very nearly the same feelings towards the ocean with me.</p>
<p style="margin: 0; text-indent: 1.5em">There now is your insular city of the Manhattoes, belted round by wharves as Indian isles by coral reefs—commerce surrounds it with her surf. Right and left, the streets take you waterward. Its extreme downtown is the battery, where that noble mole is washed by waves, and cooled by breezes, which a few hours previous were out of sight of land. Look at the crowds of water-gazers there.</p>
<p style="margin: 0; text-indent: 1.5em">Circumambulate the city of a dreamy Sabbath afternoon. Go from Corlears Hook to Coenties Slip, and from thence, by Whitehall, northward. What do you see?—Posted like silent sentinels all around the town, stand thousands upon thousands of mortal men fixed in ocean reveries.</p>
