------------------------------------------
 From the docks, head north past the
 lantern posts. The archive door opens
 only once all three are lit:

        [*]-----[*]-----[*]
         |       |       |
        WEST   CENTRE   EAST

 Light WEST first, then EAST, and CENTRE
 last. Inside, take the Tide Key from the
 chest left of the stairs before the
 water rises (about 90 seconds).

<span style="font-weight: 600"> 3.1  THE FLOODED HALL</span>
 ---------------------
 The hall floods in three stages. Stand
 on the raised tiles and use the Tide Key
 on each gate to lower the water:

   +--------+     +--------+
   | GATE A |----&gt;| GATE B |
   +--------+     +--------+
        |              |
        v              v
    [ chest ]     [ stairs ]

 Gate A first: the chest behind it holds
 the Lantern Lens (see <a href="#" style="color: #E58A6E; text-underline-offset: 2px">[ITM01]</a>).

<span style="font-weight: 600"> 3.2  THE ARCHIVIST</span>
 ------------------

 the ink pools and hit the lamps.</pre>

 ---------------------
 The hall floods in three stages. Stand
 on the raised tiles and use the Tide Key
 on each gate to lower the water:

   +--------+     +--------+
   | GATE A |----&gt;| GATE B |
   +--------+     +--------+
        |              |
        v              v
    [ chest ]     [ stairs ]

 Gate A first: the chest behind it holds
 the Lantern Lens (see <a href="#" style="color: #E58A6E; text-underline-offset: 2px">[ITM01]</a>).
