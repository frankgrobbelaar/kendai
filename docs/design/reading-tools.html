<p style="margin: 0; font-family: 'Literata', serif; font-size: 17px; line-height: 1.62; text-align: justify; hyphens: auto; text-indent: 1.5em"><span style="background: #F2D9CF; border-radius: 2px">It is not probable that this monomania in him took its instant rise at the precise time of his bodily dismemberment.</span> Then, in darting at the monster, knife in hand, he had but given loose to a sudden, passionate, corporal animosity; and when he received the stroke that tore him, he probably but felt the agonizing bodily laceration, but nothing more. Yet, when by this collision forced to turn towards home, and for long months of days and weeks, Ahab and anguish lay stretched together in one hammock, rounding in mid winter that dreary, howling Patagonian Cape; then it was, that his torn body and gashed soul bled into one another; and so interfusing, made him mad.</p>
